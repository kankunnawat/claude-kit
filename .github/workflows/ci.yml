name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# bash -eo pipefail, so a failing command inside a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-yaml
          curl -sSfL -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks

      - name: Secret scan
        run: /tmp/gitleaks git --no-banner --redact .

      - name: Shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -S warning

      - name: Skill frontmatter name matches folder
        run: |
          fails=0
          for f in skills/*/SKILL.md; do
            dir=$(basename "$(dirname "$f")")
            name=$(awk 'NR==1 && $0!="---" {exit} NR>1 && $0=="---" {exit} /^name:/ {sub(/^name:[ \t]*/, ""); sub(/[ \t]+$/, ""); gsub(/["'\'']/, ""); print; exit}' "$f")
            if [ "$name" != "$dir" ]; then
              echo "::error file=$f::name '$name' does not match folder '$dir'"
              fails=$((fails + 1))
            fi
          done
          [ "$fails" -eq 0 ]

      - name: install.sh test
        run: bash test-install.sh

      - name: Portability test
        run: python3 test-portability.py

      - name: build-landing deploy test
        run: bash skills/build-landing/scripts/test-deploy.sh
